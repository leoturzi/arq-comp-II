<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 240" width="600" height="240">
  <rect x="0" y="0" width="600" height="240" fill="white"/>

  <g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- A, B, Cin inputs (top, parallel) -->
    <line x1="65" y1="15" x2="65" y2="60"/>
    <line x1="90" y1="15" x2="90" y2="60"/>
    <line x1="115" y1="25" x2="115" y2="60"/>

    <line x1="205" y1="15" x2="205" y2="60"/>
    <line x1="230" y1="15" x2="230" y2="60"/>
    <line x1="255" y1="25" x2="255" y2="60"/>

    <line x1="345" y1="15" x2="345" y2="60"/>
    <line x1="370" y1="15" x2="370" y2="60"/>
    <line x1="395" y1="25" x2="395" y2="60"/>

    <line x1="485" y1="15" x2="485" y2="60"/>
    <line x1="510" y1="15" x2="510" y2="60"/>
    <line x1="535" y1="15" x2="535" y2="60"/>

    <!-- 4 full-adder blocks: A3/B3, A2/B2, A1/B1, A0/B0 -->
    <rect x="50" y="60" width="80" height="90" fill="white" stroke-width="2.5"/>
    <rect x="190" y="60" width="80" height="90" fill="white" stroke-width="2.5"/>
    <rect x="330" y="60" width="80" height="90" fill="white" stroke-width="2.5"/>
    <rect x="470" y="60" width="80" height="90" fill="white" stroke-width="2.5"/>

    <!-- Cs, S outputs (bottom, parallel; Cs a la izquierda de S) -->
    <line x1="70" y1="150" x2="70" y2="180"/>
    <line x1="105" y1="150" x2="105" y2="210"/>

    <line x1="210" y1="150" x2="210" y2="180"/>
    <line x1="245" y1="150" x2="245" y2="210"/>

    <line x1="350" y1="150" x2="350" y2="180"/>
    <line x1="385" y1="150" x2="385" y2="210"/>

    <line x1="490" y1="150" x2="490" y2="180"/>
    <line x1="525" y1="150" x2="525" y2="210"/>

    <!-- carry chain, ruteo en ángulo recto: Cs de box i -> Cin de box (i-1) -->
    <polyline points="490,180 425,180 425,25 395,25"/>
    <polyline points="350,180 285,180 285,25 255,25"/>
    <polyline points="210,180 145,180 145,25 115,25"/>

    <!-- Cs final (box A3) sale a la izquierda -->
    <line x1="70" y1="180" x2="15" y2="180"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="black">
    <text x="53" y="12">A3</text>
    <text x="81" y="12">B3</text>
    <text x="193" y="12">A2</text>
    <text x="221" y="12">B2</text>
    <text x="333" y="12">A1</text>
    <text x="361" y="12">B1</text>
    <text x="473" y="12">A0</text>
    <text x="501" y="12">B0</text>

    <text x="93" y="222">S3</text>
    <text x="233" y="222">S2</text>
    <text x="373" y="222">S1</text>
    <text x="513" y="222">S0</text>

    <text x="527" y="12">0</text>
    <text x="2" y="176">Cs</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="black">
    <text x="82" y="110">FA</text>
    <text x="222" y="110">FA</text>
    <text x="362" y="110">FA</text>
    <text x="502" y="110">FA</text>
  </g>
</svg>
