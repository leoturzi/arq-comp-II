<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 270" width="560" height="270">
  <rect x="0" y="0" width="560" height="270" fill="white"/>

  <g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- vertical trunks A, B, C -->
    <line x1="30" y1="15" x2="30" y2="245"/>
    <line x1="50" y1="15" x2="50" y2="245"/>
    <line x1="70" y1="15" x2="70" y2="245"/>

    <!-- AND1 (detecta 010): A' , B, C' -->
    <line x1="30" y1="20" x2="185" y2="20"/>
    <line x1="199" y1="20" x2="200" y2="20"/>
    <line x1="50" y1="40" x2="200" y2="40"/>
    <line x1="70" y1="60" x2="185" y2="60"/>
    <line x1="199" y1="60" x2="200" y2="60"/>
    <path d="M200,10 L225,10 A25,30 0 0 1 225,70 L200,70 Z" fill="white" stroke-width="2.5"/>
    <line x1="250" y1="40" x2="345" y2="40"/>

    <!-- AND2 (detecta 101): A, B', C -->
    <line x1="30" y1="110" x2="200" y2="110"/>
    <line x1="50" y1="130" x2="185" y2="130"/>
    <line x1="199" y1="130" x2="200" y2="130"/>
    <line x1="70" y1="150" x2="200" y2="150"/>
    <path d="M200,100 L225,100 A25,30 0 0 1 225,160 L200,160 Z" fill="white" stroke-width="2.5"/>
    <line x1="250" y1="130" x2="345" y2="130"/>

    <!-- AND3 (detecta 111): A, B, C -->
    <line x1="30" y1="200" x2="200" y2="200"/>
    <line x1="50" y1="220" x2="200" y2="220"/>
    <line x1="70" y1="240" x2="200" y2="240"/>
    <path d="M200,190 L225,190 A25,30 0 0 1 225,250 L200,250 Z" fill="white" stroke-width="2.5"/>
    <line x1="250" y1="220" x2="345" y2="220"/>

    <!-- inversion bubbles -->
    <circle cx="192" cy="20" r="7" fill="white" stroke-width="2.5"/>
    <circle cx="192" cy="60" r="7" fill="white" stroke-width="2.5"/>
    <circle cx="192" cy="130" r="7" fill="white" stroke-width="2.5"/>

    <!-- OR gate (3 entradas) -->
    <path d="M330,10 Q372,130 330,250 Q432,250 472,130 Q432,10 330,10 Z" fill="white" stroke-width="2.5"/>
    <line x1="472" y1="130" x2="520" y2="130"/>
  </g>

  <!-- junction dots on trunks -->
  <g fill="black" stroke="none">
    <circle cx="30" cy="20" r="3"/>
    <circle cx="50" cy="40" r="3"/>
    <circle cx="70" cy="60" r="3"/>
    <circle cx="30" cy="110" r="3"/>
    <circle cx="50" cy="130" r="3"/>
    <circle cx="70" cy="150" r="3"/>
    <circle cx="30" cy="200" r="3"/>
    <circle cx="50" cy="220" r="3"/>
    <circle cx="70" cy="240" r="3"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="black">
    <text x="20" y="10">A</text>
    <text x="40" y="10">B</text>
    <text x="60" y="10">C</text>
    <text x="502" y="125">Z</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="black">
    <text x="255" y="55">010</text>
    <text x="255" y="145">101</text>
    <text x="255" y="235">111</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="black" text-anchor="middle">
    <text x="280" y="266">Detecta 010, 101 o 111 → Z = 1 (bubble = entrada invertida)</text>
  </g>
</svg>
