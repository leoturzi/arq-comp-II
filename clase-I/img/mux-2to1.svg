<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 460 220" width="460" height="220">
  <rect x="0" y="0" width="460" height="220" fill="white"/>

  <g fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A input -->
    <line x1="10" y1="25" x2="180" y2="25"/>
    <!-- B input -->
    <line x1="10" y1="185" x2="180" y2="185"/>
    <!-- LC input trunk -->
    <line x1="10" y1="110" x2="70" y2="110"/>
    <!-- LC branch down to AND2 top input -->
    <line x1="70" y1="110" x2="70" y2="155"/>
    <line x1="70" y1="155" x2="180" y2="155"/>
    <!-- LC branch up to NOT input -->
    <line x1="70" y1="110" x2="70" y2="85"/>
    <line x1="70" y1="85" x2="90" y2="85"/>

    <!-- NOT gate (LC') -->
    <path d="M90,70 L90,100 L140,85 Z" fill="white"/>
    <circle cx="147" cy="85" r="7" fill="white"/>
    <line x1="154" y1="85" x2="170" y2="85"/>
    <line x1="170" y1="85" x2="170" y2="55"/>
    <line x1="170" y1="55" x2="180" y2="55"/>

    <!-- AND1 (A, LC') -->
    <path d="M180,10 L210,10 A30,30 0 0 1 210,70 L180,70 Z" fill="white"/>
    <line x1="240" y1="40" x2="280" y2="40"/>
    <line x1="280" y1="40" x2="280" y2="70"/>
    <line x1="280" y1="70" x2="312" y2="70"/>

    <!-- AND2 (LC, B) -->
    <path d="M180,140 L210,140 A30,30 0 0 1 210,200 L180,200 Z" fill="white"/>
    <line x1="240" y1="170" x2="280" y2="170"/>
    <line x1="280" y1="170" x2="280" y2="140"/>
    <line x1="280" y1="140" x2="312" y2="140"/>

    <!-- OR gate combining both -->
    <path d="M300,30 Q332,105 300,180 Q372,180 402,105 Q372,30 300,30 Z" fill="white"/>
    <line x1="402" y1="105" x2="450" y2="105"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="black">
    <text x="10" y="19">A</text>
    <text x="10" y="179">B</text>
    <text x="10" y="104">LC</text>
    <text x="432" y="100">Z</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="black" text-anchor="middle">
    <text x="230" y="212">Multiplexor 2:1 de 1 bit — LC=0: Z=A · LC=1: Z=B</text>
  </g>
</svg>
