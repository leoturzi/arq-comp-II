<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 220" width="380" height="220">
  <rect x="0" y="0" width="380" height="220" fill="white"/>

  <g fill="none" stroke="black" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
    <!-- A input -->
    <line x1="10" y1="20" x2="80" y2="20"/>
    <!-- B input, shared -->
    <line x1="10" y1="100" x2="40" y2="100"/>
    <line x1="40" y1="60" x2="40" y2="140"/>
    <line x1="40" y1="60" x2="80" y2="60"/>
    <line x1="40" y1="140" x2="80" y2="140"/>
    <!-- C input -->
    <line x1="10" y1="180" x2="80" y2="180"/>

    <!-- OR gate: X = A + B -->
    <path d="M80,10 Q102,40 80,70 Q122,70 142,40 Q122,10 80,10 Z" fill="white"/>
    <!-- XOR gate: Y = B (+) C -->
    <path d="M72,130 Q94,160 72,190" fill="none"/>
    <path d="M80,130 Q102,160 80,190 Q122,190 142,160 Q122,130 80,130 Z" fill="white"/>

    <!-- X wire -->
    <line x1="142" y1="40" x2="220" y2="40"/>
    <line x1="220" y1="40" x2="220" y2="85"/>
    <line x1="220" y1="85" x2="250" y2="85"/>
    <!-- Y wire -->
    <line x1="142" y1="160" x2="220" y2="160"/>
    <line x1="220" y1="160" x2="220" y2="115"/>
    <line x1="220" y1="115" x2="250" y2="115"/>

    <!-- AND gate: Z = X . Y -->
    <path d="M250,70 L275,70 A25,30 0 0 1 275,130 L250,130 Z" fill="white"/>
    <line x1="300" y1="100" x2="350" y2="100"/>
  </g>

  <g fill="black" stroke="none">
    <circle cx="40" cy="100" r="3"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="black">
    <text x="10" y="15">A</text>
    <text x="10" y="95">B</text>
    <text x="10" y="175">C</text>
    <text x="332" y="95">Z</text>
  </g>
  <g font-family="sans-serif" font-size="12" fill="black">
    <text x="150" y="30">X</text>
    <text x="150" y="150">Y</text>
  </g>
</svg>
