<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 360" width="280" height="360">
  <rect x="0" y="0" width="280" height="360" fill="white"/>

  <g fill="none" stroke="black" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <!-- trunks -->
    <line x1="30" y1="15" x2="30" y2="295"/>
    <line x1="50" y1="15" x2="50" y2="335"/>

    <!-- Gate 1 (Z0 = A' . B', AB=00) -->
    <line x1="30" y1="20" x2="125" y2="20"/>
    <line x1="139" y1="20" x2="140" y2="20"/>
    <line x1="50" y1="60" x2="125" y2="60"/>
    <line x1="139" y1="60" x2="140" y2="60"/>
    <path d="M140,10 L165,10 A25,30 0 0 1 165,70 L140,70 Z" fill="white" stroke-width="2.5"/>
    <line x1="190" y1="40" x2="230" y2="40"/>

    <!-- Gate 2 (Z1 = A' . B, AB=01) -->
    <line x1="30" y1="110" x2="125" y2="110"/>
    <line x1="139" y1="110" x2="140" y2="110"/>
    <line x1="50" y1="150" x2="140" y2="150"/>
    <path d="M140,100 L165,100 A25,30 0 0 1 165,160 L140,160 Z" fill="white" stroke-width="2.5"/>
    <line x1="190" y1="130" x2="230" y2="130"/>

    <!-- Gate 3 (Z2 = A . B', AB=10) -->
    <line x1="30" y1="200" x2="140" y2="200"/>
    <line x1="50" y1="240" x2="125" y2="240"/>
    <line x1="139" y1="240" x2="140" y2="240"/>
    <path d="M140,190 L165,190 A25,30 0 0 1 165,250 L140,250 Z" fill="white" stroke-width="2.5"/>
    <line x1="190" y1="220" x2="230" y2="220"/>

    <!-- Gate 4 (Z3 = A . B, AB=11) -->
    <line x1="30" y1="290" x2="140" y2="290"/>
    <line x1="50" y1="330" x2="140" y2="330"/>
    <path d="M140,280 L165,280 A25,30 0 0 1 165,340 L140,340 Z" fill="white" stroke-width="2.5"/>
    <line x1="190" y1="310" x2="230" y2="310"/>

    <!-- inversion bubbles -->
    <circle cx="132" cy="20" r="7" fill="white" stroke-width="2.5"/>
    <circle cx="132" cy="60" r="7" fill="white" stroke-width="2.5"/>
    <circle cx="132" cy="110" r="7" fill="white" stroke-width="2.5"/>
    <circle cx="132" cy="240" r="7" fill="white" stroke-width="2.5"/>
  </g>

  <g fill="black" stroke="none">
    <circle cx="30" cy="20" r="3"/>
    <circle cx="50" cy="60" r="3"/>
    <circle cx="30" cy="110" r="3"/>
    <circle cx="50" cy="150" r="3"/>
    <circle cx="30" cy="200" r="3"/>
    <circle cx="50" cy="240" r="3"/>
    <circle cx="30" cy="290" r="3"/>
    <circle cx="50" cy="330" r="3"/>
  </g>

  <g font-family="sans-serif" font-size="15" fill="black">
    <text x="20" y="10">A</text>
    <text x="40" y="10">B</text>
    <text x="234" y="45">Z0</text>
    <text x="234" y="135">Z1</text>
    <text x="234" y="225">Z2</text>
    <text x="234" y="315">Z3</text>
  </g>
  <g font-family="sans-serif" font-size="11" fill="black">
    <text x="192" y="55">AB=00</text>
    <text x="192" y="145">AB=01</text>
    <text x="192" y="235">AB=10</text>
    <text x="192" y="325">AB=11</text>
  </g>
</svg>
